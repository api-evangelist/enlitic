aid: enlitic
name: Enlitic
description: 'Enlitic is a healthcare AI company building the Curie platform to standardize,
  anonymize, and manage medical imaging data across radiology and enterprise imaging
  workflows. Its products include ENDEX for real-time DICOM data standardization and
  enrichment, ENCOG for automated PHI/PII anonymization of imaging data, Migratek for
  large-scale imaging data migration, and Ensight for imaging data management and analytics.
  Enlitic serves radiologists, imaging IT teams, executives, and researchers to improve
  imaging data quality, interoperability, and operational efficiency. Enlitic does not
  currently publish a public developer API, SDK, or developer portal; integration is
  delivered through its products and a customer support portal. Backed by Amplify Partners
  and DCVC.'
